<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نظام نتائج مدارس نيو فيجن الخاصة - لوحة الإدارة</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; }
        
        .header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; flex-wrap: wrap; gap: 15px; }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ff8c00; background: white; padding: 3px; object-fit: contain; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.3s, box-shadow 0.3s; }
        .logo-img:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .logo-text { font-size: 22px; font-weight: bold; background: linear-gradient(135deg, #ffd700, #ff8c00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .subtitle { font-size: 11px; color: #718096; margin-top: 2px; }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-links button, .student-link { background: none; border: none; padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 10px; transition: all 0.3s; color: #4a5568; text-decoration: none; display: inline-block; }
        .nav-links button:hover, .student-link:hover { background: #ff8c00; color: white; transform: translateY(-2px); }
        .nav-links button.active { background: linear-gradient(135deg, #ff8c00, #ffd700); color: white; }
        .student-link { background: #27ae60; color: white; }
        .student-link:hover { background: #219a52; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 25px; transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
        .card-header { background: linear-gradient(135deg, #2c3e50, #1a2a3a); color: white; padding: 18px 24px; font-size: 18px; font-weight: bold; }
        .card-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3748; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 15px; font-size: 14px; transition: all 0.3s; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #ff8c00; box-shadow: 0 0 0 3px rgba(255,140,0,0.1); }
        .btn { padding: 12px 24px; border: none; border-radius: 15px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-block; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, #2c3e50, #1a2a3a); color: white; }
        .btn-primary:hover { transform: translateY(-2px); background: linear-gradient(135deg, #ff8c00, #ffd700); color: #2c3e50; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #219a52; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: white; padding: 20px; border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .stat-box:hover { transform: translateY(-5px); }
        .stat-number { font-size: 36px; font-weight: bold; background: linear-gradient(135deg, #ffd700, #ff8c00); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { color: #718096; font-size: 13px; margin-top: 8px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .table th { background: #f7fafc; font-weight: 600; color: #2d3748; }
        .table tr:hover td { background: #faf5ff; }
        .alert { padding: 15px 20px; border-radius: 20px; margin-bottom: 20px; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .alert-error { background: #f8d7da; color: #721c24; border-right: 4px solid #e74c3c; }
        .alert-success { background: #d4edda; color: #155724; border-right: 4px solid #27ae60; }
        .file-info { background: #f7fafc; padding: 15px; border-radius: 15px; margin-top: 10px; font-size: 13px; color: #4a5568; }
        .required-order { background: #fff3cd; border-right: 4px solid #ffc107; padding: 12px; margin-top: 10px; border-radius: 15px; font-size: 13px; }
        .required-order strong { color: #856404; }
        .filter-bar { background: white; padding: 20px; border-radius: 25px; margin-bottom: 25px; }
        .filter-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end; }
        .bulk-actions { background: white; padding: 15px 20px; border-radius: 25px; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .student-card { background: white; border-radius: 25px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .student-card-header { background: linear-gradient(135deg, #2c3e50, #1a2a3a); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; cursor: pointer; }
        .student-card-header:hover { background: linear-gradient(135deg, #ff8c00, #ffd700); }
        .student-info { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; }
        .student-name { font-size: 18px; font-weight: bold; }
        .student-detail { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        .badge-hidden-count { background: #e74c3c; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .student-card-body { display: none; padding: 20px; }
        .student-card.expanded .student-card-body { display: block; }
        .expand-icon { font-size: 20px; transition: transform 0.3s; }
        .student-card.expanded .expand-icon { transform: rotate(180deg); }
        .courses-table { width: 100%; border-collapse: collapse; }
        .courses-table th, .courses-table td { padding: 12px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .courses-table th { background: #f7fafc; font-weight: 600; }
        .checkbox-col { width: 40px; text-align: center; }
        .checkbox-col input { width: 18px; height: 18px; cursor: pointer; }
        .badge-visible { background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-hidden { background: #e74c3c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-empty { background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .toggle-link { background: #e0e7ff; border: none; padding: 4px 12px; border-radius: 10px; cursor: pointer; margin: 0 3px; }
        .toggle-link:hover { background: #c7d2fe; }
        
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .stats-bar { grid-template-columns: 1fr; }
            .filter-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const App = {
            activeTab: 'dashboard',
            students: [],
            results: [],
            uploadLogs: [],
            gradeLevels: [
                { id: 1, name: 'KG1' }, { id: 2, name: 'KG2' },
                { id: 3, name: 'الصف الأول الابتدائي' }, { id: 4, name: 'الصف الثاني الابتدائي' },
                { id: 5, name: 'الصف الثالث الابتدائي' }, { id: 6, name: 'الصف الرابع الابتدائي' },
                { id: 7, name: 'الصف الخامس الابتدائي' }, { id: 8, name: 'الصف السادس الابتدائي' },
                { id: 9, name: 'الصف الأول الإعدادي' }, { id: 10, name: 'الصف الثاني الإعدادي' },
                { id: 11, name: 'الصف الثالث الإعدادي' }, { id: 12, name: 'الصف الأول الثانوي' },
                { id: 13, name: 'الصف الثاني الثانوي' }, { id: 14, name: 'الصف الثالث الثانوي' }
            ],
            
            filters: { grade: '', semester: 'first', year: '2026', hideFilter: 'all', search: '' },
            
            init() { this.loadData(); this.render(); },
            
            loadData() {
                try {
                    this.students = JSON.parse(localStorage.getItem('neovision_students') || '[]');
                    this.results = JSON.parse(localStorage.getItem('neovision_results') || '[]');
                    this.uploadLogs = JSON.parse(localStorage.getItem('neovision_uploads') || '[]');
                    console.log('📊 تم تحميل:', this.students.length, 'طالب،', this.results.length, 'نتيجة');
                } catch(e) { console.error(e); }
            },
            
            saveData() {
                localStorage.setItem('neovision_students', JSON.stringify(this.students));
                localStorage.setItem('neovision_results', JSON.stringify(this.results));
                localStorage.setItem('neovision_uploads', JSON.stringify(this.uploadLogs));
            },
            
            uploadExcelFile(file, gradeLevelId, semester, year) {
                if (!file) { this.showMessage('الرجاء اختيار ملف', 'error'); return; }
                this.showMessage('جاري معالجة الملف...', 'success');
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        
                        if (!rows || rows.length < 2) { 
                            this.showMessage('الملف فارغ أو لا يحتوي على بيانات', 'error'); 
                            return; 
                        }
                        
                        const headers = rows[0];
                        if (headers.length < 2) {
                            this.showMessage('يجب أن يحتوي الملف على عمودين على الأقل', 'error');
                            return;
                        }
                        
                        // البحث عن أعمدة الرقم القومي واسم الطالب ورقم الجلوس (بغض النظر عن الترتيب)
                        let nationalColIndex = -1;
                        let nameColIndex = -1;
                        let seatColIndex = -1;
                        
                        for (let j = 0; j < headers.length; j++) {
                            const colName = headers[j]?.toString().trim() || '';
                            if (colName.includes('الرقم القومي') || colName.includes('رقم قومي') || colName.toLowerCase().includes('national')) {
                                nationalColIndex = j;
                            }
                            if (colName.includes('اسم الطالب') || colName.includes('اسم') || colName.toLowerCase().includes('student')) {
                                nameColIndex = j;
                            }
                            if (colName.includes('جلوس') || colName.includes('seat') || colName.toLowerCase().includes('seat')) {
                                seatColIndex = j;
                            }
                        }
                        
                        if (nationalColIndex === -1 || nameColIndex === -1) {
                            this.showMessage('⚠️ يجب أن يحتوي الملف على عمود "الرقم القومي" و عمود "اسم الطالب"', 'error');
                            return;
                        }
                        
                        let newResults = [];
                        let counter = 0;
                        let studentsCount = 0;
                        
                        // معالجة كل صف
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row) continue;
                            
                            let nationalId = row[nationalColIndex]?.toString().trim();
                            let studentName = row[nameColIndex]?.toString().trim();
                            let seatNumber = (seatColIndex !== -1 && row[seatColIndex]) ? row[seatColIndex]?.toString().trim() : '';
                            
                            if (!nationalId || !studentName) continue;
                            if (nationalId.length !== 14 || isNaN(nationalId)) continue;
                            
                            studentsCount++;
                            
                            let student = this.students.find(s => s.nationalId === nationalId);
                            if (!student) {
                                student = {
                                    id: Date.now() + counter++,
                                    nationalId: nationalId,
                                    name: studentName,
                                    seatNumber: seatNumber || '',
                                    grade_level_id: gradeLevelId,
                                    academic_year: year,
                                    created_at: new Date().toISOString()
                                };
                                this.students.push(student);
                            } else if (seatNumber && !student.seatNumber) {
                                student.seatNumber = seatNumber;
                            }
                            
                            // معالجة جميع الأعمدة بالترتيب (الحفاظ على ترتيب الشيت)
                            let orderIndex = 0;
                            for (let j = 0; j < headers.length; j++) {
                                // تخطي أعمدة الرقم القومي واسم الطالب ورقم الجلوس
                                if (j === nationalColIndex || j === nameColIndex || j === seatColIndex) continue;
                                
                                const subjectName = headers[j]?.toString().trim();
                                if (!subjectName) continue;
                                
                                let subjectGrade = row[j]?.toString().trim();
                                // إذا كانت الخلية فارغة، نضع قيمة خاصة تدل على الفراغ
                                if (!subjectGrade || subjectGrade === "") {
                                    subjectGrade = "—";
                                }
                                
                                newResults.push({
                                    id: Date.now() + counter++,
                                    student_id: student.id,
                                    grade_level_id: gradeLevelId,
                                    semester: semester,
                                    academic_year: year,
                                    subject_name: subjectName,
                                    subject_grade: subjectGrade,
                                    is_hidden: false,
                                    is_empty: (subjectGrade === "—"),
                                    display_order: orderIndex++, // حفظ الترتيب للحفاظ عليه عند العرض
                                    upload_date: new Date().toISOString(),
                                    upload_filename: file.name
                                });
                            }
                        }
                        
                        if (studentsCount === 0) { 
                            this.showMessage('لم يتم العثور على بيانات صالحة (أرقام قومية صحيحة)', 'error'); 
                            return; 
                        }
                        
                        if (newResults.length === 0) { 
                            this.showMessage('لم يتم العثور على مواد دراسية', 'error'); 
                            return; 
                        }
                        
                        this.results.push(...newResults);
                        this.uploadLogs.unshift({
                            id: Date.now(),
                            filename: file.name,
                            grade_level_id: gradeLevelId,
                            academic_year: year,
                            semester: semester,
                            records_count: newResults.length,
                            students_count: studentsCount,
                            upload_date: new Date().toISOString()
                        });
                        
                        this.saveData();
                        this.showMessage(`✅ تم رفع ${newResults.length} مادة دراسية لعدد ${studentsCount} طالب (تم الحفاظ على ترتيب الشيت)`, 'success');
                        this.filters = { grade: gradeLevelId.toString(), semester: semester, year: year, hideFilter: 'all', search: '' };
                        this.render();
                    } catch(err) { 
                        console.error(err);
                        this.showMessage('خطأ: ' + err.message, 'error'); 
                    }
                };
                reader.onerror = () => this.showMessage('خطأ في قراءة الملف', 'error');
                reader.readAsArrayBuffer(file);
            },
            
            deleteUpload(uploadId) {
                const upload = this.uploadLogs.find(u => u.id == uploadId);
                if (!upload) return;
                if (confirm(`🗑️ حذف ملف "${upload.filename}"؟`)) {
                    const uploadDate = new Date(upload.upload_date);
                    const timeWindow = 5000;
                    this.results = this.results.filter(r => Math.abs(new Date(r.upload_date) - uploadDate) > timeWindow);
                    this.uploadLogs = this.uploadLogs.filter(u => u.id != uploadId);
                    this.saveData();
                    this.showMessage(`✅ تم حذف الملف`, 'success');
                    this.render();
                }
            },
            
            toggleResult(resultId) {
                const result = this.results.find(r => r.id == resultId);
                if (result) {
                    result.is_hidden = !result.is_hidden;
                    this.saveData();
                    this.showMessage(`تم ${result.is_hidden ? 'إخفاء' : 'إظهار'} النتيجة`, 'success');
                    this.render();
                }
            },
            
            deleteResult(resultId) {
                if (confirm('هل أنت متأكد من حذف هذه النتيجة؟')) {
                    this.results = this.results.filter(r => r.id != resultId);
                    this.saveData();
                    this.showMessage('تم حذف النتيجة', 'success');
                    this.render();
                }
            },
            
            bulkToggle(resultIds, hide) {
                this.results.forEach(r => { if (resultIds.includes(r.id)) r.is_hidden = hide; });
                this.saveData();
                this.showMessage(`تم ${hide ? 'إخفاء' : 'إظهار'} ${resultIds.length} نتيجة`, 'success');
                this.render();
            },
            
            bulkActions(action) {
                const checkboxes = document.querySelectorAll('.result-checkbox:checked');
                const ids = Array.from(checkboxes).map(cb => parseInt(cb.dataset.resultId));
                if (ids.length === 0) { this.showMessage('الرجاء تحديد النتائج المراد تعديلها', 'error'); return; }
                if (confirm(`هل أنت متأكد من ${action === 'show' ? 'إظهار' : 'إخفاء'} ${ids.length} نتيجة؟`)) {
                    this.bulkToggle(ids, action === 'hide');
                }
            },
            
            showMessage(message, type) {
                const oldMsg = document.querySelector('.alert');
                if (oldMsg) oldMsg.remove();
                const div = document.createElement('div');
                div.className = `alert alert-${type}`;
                div.style.whiteSpace = 'pre-line';
                div.innerHTML = message;
                const container = document.querySelector('.container');
                if (container) container.insertBefore(div, container.firstChild);
                setTimeout(() => div.remove(), 5000);
            },
            
            getStats() {
                return {
                    totalStudents: this.students.length,
                    totalResults: this.results.length,
                    hiddenResults: this.results.filter(r => r.is_hidden).length,
                    totalUploads: this.uploadLogs.length
                };
            },
            
            getFilteredResults() {
                let filtered = [...this.results];
                if (this.filters.grade) filtered = filtered.filter(r => r.grade_level_id == this.filters.grade);
                if (this.filters.semester) filtered = filtered.filter(r => r.semester === this.filters.semester);
                if (this.filters.year) filtered = filtered.filter(r => r.academic_year === this.filters.year);
                if (this.filters.hideFilter === 'visible') filtered = filtered.filter(r => !r.is_hidden);
                if (this.filters.hideFilter === 'hidden') filtered = filtered.filter(r => r.is_hidden);
                return filtered;
            },
            
            getStudentsWithResults() {
                let filteredResults = this.getFilteredResults();
                if (this.filters.search) {
                    const studentIds = this.students.filter(s => s.name.includes(this.filters.search)).map(s => s.id);
                    filteredResults = filteredResults.filter(r => studentIds.includes(r.student_id));
                }
                const map = new Map();
                filteredResults.forEach(r => {
                    const student = this.students.find(s => s.id === r.student_id);
                    if (student) {
                        if (!map.has(student.id)) map.set(student.id, { ...student, results: [] });
                        map.get(student.id).results.push(r);
                    }
                });
                // ترتيب النتائج حسب display_order للحفاظ على ترتيب الشيت
                for (let student of map.values()) {
                    student.results.sort((a, b) => (a.display_order || 0) - (b.display_order || 0));
                }
                return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
            },
            
            updateFilters(newFilters) { this.filters = { ...this.filters, ...newFilters }; this.render(); },
            
            renderDashboard() {
                const stats = this.getStats();
                const recentUploads = this.uploadLogs.slice(0, 10);
                return `
                    <div class="stats-bar">
                        <div class="stat-box"><div class="stat-number">${stats.totalStudents}</div><div class="stat-label">👨‍🎓 إجمالي الطلاب</div></div>
                        <div class="stat-box"><div class="stat-number">${stats.totalResults}</div><div class="stat-label">📊 المواد المسجلة</div></div>
                        <div class="stat-box"><div class="stat-number" style="color:#e74c3c;">${stats.hiddenResults}</div><div class="stat-label">🔒 مواد محجوبة</div></div>
                        <div class="stat-box"><div class="stat-number">${stats.totalUploads}</div><div class="stat-label">📁 عمليات رفع</div></div>
                    </div>
                    <div class="card">
                        <div class="card-header">📤 رفع ملف نتائج جديد</div>
                        <div class="card-body">
                            <form id="uploadForm">
                                <div class="form-group"><label>🎓 المرحلة الدراسية:</label><select id="gradeLevel" required><option value="">اختر المرحلة</option>${this.gradeLevels.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}</select></div>
                                <div class="form-group"><label>📖 الفصل الدراسي:</label><select id="semester" required><option value="first">الأول</option><option value="second">الثاني</option></select></div>
                                <div class="form-group"><label>📅 السنة الدراسية:</label><select id="academicYear"><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option></select></div>
                                <div class="form-group"><label>📎 ملف Excel:</label><input type="file" id="excelFile" accept=".xlsx, .xls, .csv" required></div>
                                <div class="required-order"><strong>📌 ملاحظات مهمة:</strong><br>
                                • العمود الذي يحتوي على "الرقم القومي" (أي عمود في أي مكان)<br>
                                • العمود الذي يحتوي على "اسم الطالب" (أي عمود في أي مكان)<br>
                                • العمود الذي يحتوي على "رقم الجلوس" (اختياري - أي عمود)<br>
                                • جميع الأعمدة الأخرى سيتم عرضها بنفس ترتيبها في الشيت</div>
                                <button type="submit" class="btn btn-primary" style="margin-top:15px;">🚀 رفع الملف</button>
                            </form>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">📋 عمليات الرفع السابقة</div>
                        <div class="card-body">
                            ${recentUploads.length > 0 ? `
                                <table class="table"><thead><tr><th>#</th><th>اسم الملف</th><th>المرحلة</th><th>السنة</th><th>عدد المواد</th><th>عدد الطلاب</th><th>التاريخ</th><th></th></tr></thead>
                                <tbody>${recentUploads.map((u, i) => `<tr><td style="text-align:center;">${i+1}</td><td style="text-align:center;">${this.escapeHtml(u.filename)}</td><td style="text-align:center;">${this.gradeLevels.find(g => g.id == u.grade_level_id)?.name || '-'}</td><td style="text-align:center;">${u.academic_year}</td><td style="text-align:center;">${u.records_count}</td><td style="text-align:center;">${u.students_count || '-'}</td><td style="text-align:center;">${new Date(u.upload_date).toLocaleString('ar')}</td><td style="text-align:center;"><button class="btn btn-danger btn-sm" onclick="App.deleteUpload(${u.id})">🗑️ حذف</button></td></tr>`).join('')}</tbody></table>
                            ` : '<p style="text-align:center;">لا توجد عمليات رفع</p>'}
                        </div>
                    </div>
                `;
            },
            
            renderResults() {
                const studentsData = this.getStudentsWithResults();
                const filtered = this.getFilteredResults();
                
                if (studentsData.length === 0) {
                    return `
                        <div class="stats-bar">
                            <div class="stat-box"><div class="stat-number">0</div><div class="stat-label">👨‍🎓 عدد الطلاب</div></div>
                            <div class="stat-box"><div class="stat-number">0</div><div class="stat-label">📊 المواد المعروضة</div></div>
                            <div class="stat-box"><div class="stat-number">0</div><div class="stat-label">✅ ظاهرة</div></div>
                            <div class="stat-box"><div class="stat-number">0</div><div class="stat-label">🔒 محجوبة</div></div>
                        </div>
                        <div class="filter-bar">
                            <form class="filter-form" id="filterForm">
                                <div class="form-group"><label>المرحلة</label><select name="grade"><option value="">الكل</option>${this.gradeLevels.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}</select></div>
                                <div class="form-group"><label>الفصل</label><select name="semester"><option value="first">الأول</option><option value="second">الثاني</option></select></div>
                                <div class="form-group"><label>السنة</label><select name="year"><option value="2026">2026</option><option value="2025">2025</option></select></div>
                                <div class="form-group"><label>الحالة</label><select name="hideFilter"><option value="all">الكل</option><option value="visible">الظاهرة</option><option value="hidden">المخفية</option></select></div>
                                <div class="form-group"><label>بحث</label><input type="text" name="search" placeholder="اسم الطالب"></div>
                                <div class="form-group"><button type="submit" class="btn btn-primary">🔍 بحث</button><button type="button" id="resetFilters" class="btn" style="background:#e2e8f0;">إعادة تعيين</button></div>
                            </form>
                        </div>
                        <div class="card" style="padding:40px;text-align:center;">😕 لا توجد نتائج مطابقة لمعايير البحث<br><small>تأكد من رفع ملفات النتائج أولاً</small></div>
                    `;
                }
                
                return `
                    <div class="stats-bar">
                        <div class="stat-box"><div class="stat-number">${studentsData.length}</div><div class="stat-label">👨‍🎓 عدد الطلاب</div></div>
                        <div class="stat-box"><div class="stat-number">${filtered.length}</div><div class="stat-label">📊 المواد المعروضة</div></div>
                        <div class="stat-box"><div class="stat-number" style="color:#27ae60;">${filtered.filter(r => !r.is_hidden).length}</div><div class="stat-label">✅ ظاهرة</div></div>
                        <div class="stat-box"><div class="stat-number" style="color:#e74c3c;">${filtered.filter(r => r.is_hidden).length}</div><div class="stat-label">🔒 محجوبة</div></div>
                    </div>
                    
                    <div class="filter-bar">
                        <form class="filter-form" id="filterForm">
                            <div class="form-group"><label>المرحلة</label><select name="grade"><option value="">الكل</option>${this.gradeLevels.map(g => `<option value="${g.id}" ${this.filters.grade == g.id ? 'selected' : ''}>${g.name}</option>`).join('')}</select></div>
                            <div class="form-group"><label>الفصل</label><select name="semester"><option value="first" ${this.filters.semester === 'first' ? 'selected' : ''}>الأول</option><option value="second" ${this.filters.semester === 'second' ? 'selected' : ''}>الثاني</option></select></div>
                            <div class="form-group"><label>السنة</label><select name="year"><option value="2026" ${this.filters.year === '2026' ? 'selected' : ''}>2026</option><option value="2025" ${this.filters.year === '2025' ? 'selected' : ''}>2025</option></select></div>
                            <div class="form-group"><label>الحالة</label><select name="hideFilter"><option value="all" ${this.filters.hideFilter === 'all' ? 'selected' : ''}>الكل</option><option value="visible" ${this.filters.hideFilter === 'visible' ? 'selected' : ''}>الظاهرة</option><option value="hidden" ${this.filters.hideFilter === 'hidden' ? 'selected' : ''}>المخفية</option></select></div>
                            <div class="form-group"><label>بحث</label><input type="text" name="search" value="${this.escapeHtml(this.filters.search)}" placeholder="اسم الطالب"></div>
                            <div class="form-group"><button type="submit" class="btn btn-primary">🔍 بحث</button><button type="button" id="resetFilters" class="btn" style="background:#e2e8f0;">إعادة تعيين</button></div>
                        </form>
                    </div>
                    
                    <div class="bulk-actions">
                        <button class="btn btn-sm btn-success" id="bulkShowBtn">✅ إظهار المحدد</button>
                        <button class="btn btn-sm btn-danger" id="bulkHideBtn">🔒 إخفاء المحدد</button>
                        <label><input type="checkbox" id="selectAll"> تحديد الكل</label>
                    </div>
                    
                    <div id="studentsContainer">
                        ${studentsData.map(student => {
                            const gradeName = this.gradeLevels.find(g => g.id == student.grade_level_id)?.name || '-';
                            const hiddenCount = student.results.filter(r => r.is_hidden).length;
                            const emptyCount = student.results.filter(r => r.is_empty).length;
                            return `
                                <div class="student-card">
                                    <div class="student-card-header" onclick="this.closest('.student-card').classList.toggle('expanded')">
                                        <div class="student-info">
                                            <div class="student-name">📚 ${this.escapeHtml(student.name)}</div>
                                            <div class="student-detail">${gradeName}</div>
                                            <div class="student-detail">📅 ${student.academic_year}</div>
                                            ${student.seatNumber ? `<div class="student-detail">🪑 ${this.escapeHtml(student.seatNumber)}</div>` : ''}
                                            ${hiddenCount > 0 ? `<div class="badge-hidden-count">🔒 ${hiddenCount} محجوبة</div>` : ''}
                                            ${emptyCount > 0 ? `<div class="badge-hidden-count" style="background:#f59e0b;">⚠️ ${emptyCount} فارغة</div>` : ''}
                                        </div>
                                        <span class="expand-icon">▼</span>
                                    </div>
                                    <div class="student-card-body">
                                        <table class="courses-table">
                                            <thead>
                                                <tr>
                                                    <th class="checkbox-col"><input type="checkbox" class="group-checkbox" data-student="${student.id}"></th>
                                                    <th>📖 المادة</th>
                                                    <th>⭐ الدرجة</th>
                                                    <th>🔐 الحالة</th>
                                                    <th>⚙️ إجراءات</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${student.results.map(result => {
                                                    const isEmpty = result.is_empty || result.subject_grade === "—";
                                                    const badgeClass = result.is_hidden ? 'badge-hidden' : (isEmpty ? 'badge-empty' : 'badge-visible');
                                                    const badgeText = result.is_hidden ? 'محجوبة' : (isEmpty ? 'فارغة' : 'ظاهرة');
                                                    const displayGrade = isEmpty ? '—' : result.subject_grade;
                                                    return `
                                                        <tr style="${result.is_hidden ? 'background:#fef2f2;' : (isEmpty ? 'background:#fffbeb;' : '')}">
                                                            <td class="checkbox-col"><input type="checkbox" class="result-checkbox" data-result-id="${result.id}"></td>
                                                            <td>${this.escapeHtml(result.subject_name)}</td>
                                                            <td><strong>${this.escapeHtml(displayGrade)}</strong></td>
                                                            <td><span class="${badgeClass}">${badgeText}</span></td>
                                                            <td>
                                                                <button class="toggle-link" onclick="App.toggleResult(${result.id})">${result.is_hidden ? '👁️ إظهار' : '🔒 إخفاء'}</button>
                                                                <button class="toggle-link" onclick="App.deleteResult(${result.id})" style="background:#fee; color:#c53030;">🗑️ حذف</button>
                                                            </td>
                                                        </tr>
                                                    `;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            },
            
            render() {
                const app = document.getElementById('app');
                let content = `
                    <div class="header"><div class="header-content">
                        <div class="logo-section"><img src="نيو فيجن.jpg" class="logo-img" onerror="this.src='https://placehold.co/50x50/ff8c00/white?text=NV'"><div><div class="logo-text">🏫 نظام نتائج مدارس نيو فيجن الخاصة</div><div class="subtitle">New Vision Private Schools - لوحة الإدارة</div></div></div>
                        <div class="nav-links"><button class="${this.activeTab === 'dashboard' ? 'active' : ''}" data-tab="dashboard">📊 لوحة التحكم</button><button class="${this.activeTab === 'results' ? 'active' : ''}" data-tab="results">📖 عرض المواد</button><a href="student.html" class="student-link">🔍 صفحة الاستعلام للطلاب</a></div>
                    </div></div>
                    <div class="container">${this.activeTab === 'dashboard' ? this.renderDashboard() : this.renderResults()}</div>
                `;
                app.innerHTML = content;
                this.bindEvents();
            },
            
            bindEvents() {
                document.querySelectorAll('[data-tab]').forEach(btn => {
                    btn.addEventListener('click', () => { this.activeTab = btn.dataset.tab; this.render(); });
                });
                
                const uploadForm = document.getElementById('uploadForm');
                if (uploadForm) {
                    uploadForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const file = document.getElementById('excelFile').files[0];
                        const gradeLevelId = parseInt(document.getElementById('gradeLevel').value);
                        const semester = document.getElementById('semester').value;
                        const year = document.getElementById('academicYear').value;
                        if (!gradeLevelId) { this.showMessage('اختر المرحلة', 'error'); return; }
                        if (!file) { this.showMessage('اختر ملف', 'error'); return; }
                        this.uploadExcelFile(file, gradeLevelId, semester, year);
                    });
                }
                
                const filterForm = document.getElementById('filterForm');
                if (filterForm) {
                    filterForm.onsubmit = (e) => {
                        e.preventDefault();
                        const fd = new FormData(filterForm);
                        this.updateFilters({
                            grade: fd.get('grade') || '',
                            semester: fd.get('semester') || 'first',
                            year: fd.get('year') || '2026',
                            hideFilter: fd.get('hideFilter') || 'all',
                            search: fd.get('search') || ''
                        });
                    };
                }
                
                const resetBtn = document.getElementById('resetFilters');
                if (resetBtn) {
                    resetBtn.onclick = () => {
                        this.updateFilters({ grade: '', semester: 'first', year: '2026', hideFilter: 'all', search: '' });
                    };
                }
                
                const bulkShowBtn = document.getElementById('bulkShowBtn');
                const bulkHideBtn = document.getElementById('bulkHideBtn');
                if (bulkShowBtn) bulkShowBtn.onclick = () => this.bulkActions('show');
                if (bulkHideBtn) bulkHideBtn.onclick = () => this.bulkActions('hide');
                
                const selectAll = document.getElementById('selectAll');
                if (selectAll) {
                    selectAll.onchange = (e) => {
                        document.querySelectorAll('.result-checkbox').forEach(cb => cb.checked = e.target.checked);
                    };
                }
            },
            
            escapeHtml(text) { if (!text) return ''; return String(text).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        };
        
        window.App = App;
        App.init();
    </script>
</body>
</html>
